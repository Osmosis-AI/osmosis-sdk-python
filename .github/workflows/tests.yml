name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/ruff-action@v4.1.0

      - uses: astral-sh/ruff-action@v4.1.0
        with:
          args: "format --check"

  typecheck-pyright:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --all-extras --group dev
      - name: Run pyright
        run: uv run pyright osmosis_ai/
      - name: Verify public API types
        run: |
          output=$(uv run --no-editable pyright --verifytypes osmosis_ai --ignoreexternal 2>&1) || true
          echo "$output"
          # Known --verifytypes baselines we intentionally skip:
          #   * harbor.harness_agent: inherits harbor's BaseInstalledAgent which
          #     has no type stubs ("base class / metaclass unknown"). Anchored to
          #     that module so errors elsewhere (e.g. a harness_agent_config
          #     member) are still reported.
          unexpected=$(echo "$output" | awk '
            /^osmosis_ai\./ { sym = $0 }
            /error:/ {
              if (sym ~ /harbor\.harness_agent\./) next
              print $0
            }
          ')
          if [ -n "$unexpected" ]; then
            echo "::error::Unexpected verifytypes errors:"
            echo "$unexpected"
            exit 1
          fi

  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-extras --group dev

      - name: Run tests with coverage
        if: matrix.python-version == '3.12'
        run: uv run pytest --cov=osmosis_ai --cov-branch --cov-report=term-missing --cov-report=xml

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12' && !github.event.pull_request.head.repo.fork
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Run tests
        if: matrix.python-version != '3.12'
        run: uv run pytest

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Build package
        run: uv build

      - name: Check package
        run: uvx twine check --strict dist/*

      - name: Verify artifact filenames match package version
        run: |
          VERSION=$(uv run --no-project --python 3.12 python -c 'import re, pathlib; text = pathlib.Path("osmosis_ai/consts.py").read_text(); print(re.search(r"^PACKAGE_VERSION\s*=\s*\"([^\"]+)\"", text, re.MULTILINE).group(1))')
          uv run --no-project --python 3.12 python - "$VERSION" <<'PY'
          import pathlib
          import re
          import sys

          version = sys.argv[1]
          artifacts = {
              path.name
              for path in pathlib.Path("dist").iterdir()
              if path.suffix == ".whl" or path.name.endswith(".tar.gz")
          }
          expected_sdist = f"osmosis_ai-{version}.tar.gz"
          matching_wheels = [
              name
              for name in artifacts
              if re.fullmatch(rf"osmosis_ai-{re.escape(version)}-.+\.whl", name)
          ]

          if expected_sdist not in artifacts:
              print(f"::error::Missing source distribution for version {version}: {expected_sdist}")
              sys.exit(1)
          if not matching_wheels:
              print(f"::error::Missing wheel artifact for version {version}")
              sys.exit(1)

          mismatched = sorted(name for name in artifacts if version not in name)
          if mismatched:
              print(f"::error::Artifacts do not match PACKAGE_VERSION {version}: {', '.join(mismatched)}")
              sys.exit(1)
          PY

      - name: Upload dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  wheel-smoke:
    name: Wheel smoke (${{ matrix.scenario }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: bare
            extra: ""
          - scenario: server
            extra: "[server]"
          - scenario: strands
            extra: "[strands]"
          - scenario: openai-agents
            extra: "[openai-agents]"
          - scenario: harbor
            extra: "[harbor]"
          - scenario: rubric
            extra: "[rubric]"
          - scenario: parquet
            extra: "[parquet]"
          - scenario: full
            extra: "[full]"
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Download built wheel
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Install and verify wheel
        env:
          INSTALL_EXTRA: ${{ matrix.extra }}
          SMOKE_SCENARIO: ${{ matrix.scenario }}
        run: |
          mapfile -t wheels < <(find "$GITHUB_WORKSPACE/dist" -maxdepth 1 -type f -name '*.whl' -print | sort)
          if [ "${#wheels[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one wheel, found ${#wheels[@]}"
            exit 1
          fi

          smoke_root=$(mktemp -d)
          python="$smoke_root/venv/bin/python"
          install_spec="${wheels[0]}${INSTALL_EXTRA}"

          uv venv --python 3.12 "$smoke_root/venv"
          (
            cd "$smoke_root"
            env -u PYTHONPATH uv pip install --python "$python" "$install_spec"
            env -u PYTHONPATH uv pip check --python "$python"
            env -u PYTHONPATH "$python" -I \
              "$GITHUB_WORKSPACE/.github/scripts/verify-wheel-install.py" \
              --scenario "$SMOKE_SCENARIO" \
              --source-root "$GITHUB_WORKSPACE"
          )
