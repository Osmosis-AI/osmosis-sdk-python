[project]
name = "bench-harness"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # The harness runs inside the task container, which only needs the
    # framework-neutral core, so no extra is selected. The benchmark
    # intentionally tracks the SDK's default branch to exercise the latest
    # in-container runner.
    "osmosis-ai @ https://github.com/Osmosis-AI/osmosis-sdk-python/archive/refs/heads/main.tar.gz",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bench_harness*"]
