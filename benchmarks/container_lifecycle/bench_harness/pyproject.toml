[project]
name = "bench-harness"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # The harness runs inside the task container, which only needs the
    # framework-neutral core, so no extra is selected. Pinned at the SDK's
    # default branch because the in-container runner is not released yet.
    # Re-run this benchmark once PR #270 lands: main's runner still writes
    # trajectories through Harbor, which no-ops silently inside the container.
    "osmosis-ai @ https://github.com/Osmosis-AI/osmosis-sdk-python/archive/refs/heads/main.tar.gz",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bench_harness*"]
