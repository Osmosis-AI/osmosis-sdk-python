[build-system]
# setuptools>=77 is required for PEP 639 license metadata
# (SPDX `license = "MIT"` expression + `license-files`).
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "osmosis-ai"
dynamic = ["version"]
description = "A Python SDK and CLI for building agent rollouts and managing LLM post-training workflows on Osmosis."
readme = "README.md"
authors = [
    {name = "Osmosis AI", email = "jake@osmosis.ai"}
]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
requires-python = ">=3.12"
dependencies = [
    # Security floors (CVE remediation): patched in python-dotenv 1.2.2 and
    # requests 2.33.0. Lower bounds only, so they can still float up.
    "python-dotenv>=1.2.2,<2.0.0",
    "requests>=2.33.0,<3.0.0",
    # 1.91.1 is the tested compatibility floor and includes the proxy
    # auth-bypass / SSTI / SQLi / RCE fixes from the earlier 1.84.0 floor.
    "litellm>=1.91.1,<2.0.0",
    # LiteLLM's tool-call path imports orjson at runtime, but only declares it
    # through its larger proxy extra.
    "orjson>=3.11.6,<4.0",
    "tqdm>=4.0.0,<5.0.0",
    # Remote rollout SDK dependencies
    "httpx>=0.25.0,<1.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "strands-agents[litellm]>=1.29.0",
    # >=0.18.1 supports OpenAI Python 2.45's cache_write_tokens usage field.
    "openai-agents[litellm]>=0.18.1,<0.19",
    # Secure credential storage (system keychain)
    "keyring>=25.0.0",
    # Interactive CLI prompts
    "questionary>=2.1.0,<3.0.0",
    # Requirement parsing for the submit preflight. Transitive via setuptools and
    # litellm, but declared because the CLI imports it directly.
    "packaging>=24.0",
    "platformdirs>=4.0",
    # CLI framework. <0.28 keeps cli/_click_compat.py's private imports stable.
    "typer>=0.27,<0.28",
    # Do not directly constrain typer-slim: versions <0.22 shared typer/* with
    # typer, and upgrading that legacy distribution can delete Typer's files.
    "rich>=14.2.0",
    # Pinned so the CLI preflight and the rollout server resolve the same harbor;
    # a harbor release cannot change what a rollout runs without an SDK release.
    # EnvironmentType.SKYPILOT needs >=0.20.0. Never the [skypilot] extra: its
    # skypilot-nightly claims the `sky` namespace the rollout runtime provides.
    "harbor[daytona]>=0.20.0,<0.21",
    # Security floors for load-bearing transitive deps (CVE remediation):
    # aiohttp is exercised via litellm's async transport, and cryptography is
    # loaded via keyring's SecretService backend on Linux. Lower bounds only,
    # so they can still float up with their parents.
    "aiohttp>=3.14.1",
    "cryptography>=48.0.1",
    # mcp arrives transitively via strands-agents and openai-agents. The SDK
    # itself never imports it, but >=1.28.1 is the floor that clears the
    # server-transport advisories (GHSA-hvrp-rf83-w775, GHSA-jpw9-pfvf-9f58,
    # GHSA-vj7q-gjh5-988w) for consumers that do build MCP servers on top.
    "mcp>=1.28.1",
    # External click arrives via litellm/pyiceberg/uvicorn. >=8.3.3 drops the
    # shell=True in click.edit()/pager (CVE-2026-7246). NOTE: this is purely a
    # floor — CLI code must still never import click, since Typer vendors its
    # own copy (see osmosis_ai/cli/_click_compat.py); the vendored copy was
    # never affected.
    "click>=8.3.3",
]

[project.optional-dependencies]
# Platform CLI (dataset upload/validate)
platform = [
    # Parquet file validation. >=23.0.1 is the CVE security floor.
    "pyarrow>=23.0.1",
]

# Server dependencies for rollout serving
server = [
    "osmosis-ai[platform]",
    "fastapi>=0.100.0,<1.0.0",
    "uvicorn>=0.23.0,<1.0.0",
]

# Development dependencies (testing, formatting, type checking, etc.)
# Includes server extra so pyright can resolve server-related imports.
dev = [
    "osmosis-ai[server]",
    "pytest>=9.0.3,<10.0.0",
    "pytest-asyncio>=1.4.0,<2.0.0",
    "pytest-cov>=7.1.0",
    "ruff==0.16.0",  # Keep in sync with pre-commit and CI
    "pre-commit>=4.6.0,<5.0.0",
    "pyright[nodejs]==1.1.411",
    "types-requests>=2.0",
]

# Full installation with all optional features
full = [
    "osmosis-ai[server]",
]

[project.urls]
Homepage = "https://github.com/Osmosis-AI/osmosis-sdk-python"
Issues = "https://github.com/Osmosis-AI/osmosis-sdk-python/issues"
Changelog = "https://github.com/Osmosis-AI/osmosis-sdk-python/blob/main/CHANGELOG.md"

[project.scripts]
osmosis = "osmosis_ai.cli.main:main"
osmosis_ai = "osmosis_ai.cli.main:main"
osmosis-ai = "osmosis_ai.cli.main:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["osmosis_ai*"]

[tool.setuptools.package-data]
osmosis_ai = [
    "py.typed",
    "templates/_scaffolds/rollout/*.tpl",
]

[tool.setuptools.dynamic]
version = {attr = "osmosis_ai.consts.PACKAGE_VERSION"}

[tool.coverage.run]
source = ["osmosis_ai"]
omit = [
    "tests/*",
    "*/consts.py",
    # CLI command groups (thin Typer shells) + interactive prompts
    "osmosis_ai/cli/commands/*",
    "osmosis_ai/cli/main.py",
    "osmosis_ai/cli/upgrade.py",
    "osmosis_ai/cli/prompts.py",
    # Platform CLI business logic (API calls, OAuth, interactive prompts)
    "osmosis_ai/platform/cli/*",
    # Rollout — ABCs, type defs, integrations, harbor backend
    "osmosis_ai/rollout/agent_workflow.py",
    "osmosis_ai/rollout/grader.py",
    "osmosis_ai/rollout/backend/base.py",
    "osmosis_ai/rollout/types/*",
    "osmosis_ai/rollout/integrations/*",
    "osmosis_ai/rollout/backend/harbor/*",
]

[tool.coverage.report]
omit = [
    "tests/*",
    "*/consts.py",
    # CLI command groups (thin Typer shells) + interactive prompts
    "osmosis_ai/cli/commands/*",
    "osmosis_ai/cli/main.py",
    "osmosis_ai/cli/upgrade.py",
    "osmosis_ai/cli/prompts.py",
    # Platform CLI business logic (API calls, OAuth, interactive prompts)
    "osmosis_ai/platform/cli/*",
    # Rollout — ABCs, type defs, integrations, harbor backend
    "osmosis_ai/rollout/agent_workflow.py",
    "osmosis_ai/rollout/grader.py",
    "osmosis_ai/rollout/backend/base.py",
    "osmosis_ai/rollout/types/*",
    "osmosis_ai/rollout/integrations/*",
    "osmosis_ai/rollout/backend/harbor/*",
]
fail_under = 70
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",    # line-too-long (handled by ruff format)
    "E402",    # module-import-not-at-top-of-file (intentional lazy/conditional imports)
    "SIM117",  # multiple-with-statements (nested with is often clearer in tests)
    "RUF012",  # mutable-class-default (common with Pydantic models)
]

# En dash is used intentionally as the placeholder for empty/unset values.
allowed-confusables = ["–"]

[tool.ruff.lint.per-file-ignores]
# B008: function-call-in-default-argument — required by Typer for typer.Option/Argument
"**/cli/*.py" = ["B008"]
"**/cli/**/*.py" = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["osmosis_ai"]

[tool.pyright]
pythonVersion = "3.12"
include = ["osmosis_ai"]
exclude = [
    "tests",
    "build",
    "dist",
    "**/__pycache__",
]
typeCheckingMode = "standard"
reportMissingTypeStubs = false
reportCallInDefaultInitializer = false
