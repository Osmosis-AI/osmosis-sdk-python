[build-system]
# setuptools>=77 is required for PEP 639 license metadata
# (SPDX `license = "MIT"` expression + `license-files`).
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "osmosis-ai"
dynamic = ["version"]
description = "A Python SDK and CLI for building agent rollouts and managing LLM post-training workflows on Osmosis."
readme = "README.md"
authors = [
    {name = "Osmosis AI", email = "jake@osmosis.ai"}
]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
requires-python = ">=3.12"
dependencies = [
    # CLI and rollout core. Security floors are kept with the feature that
    # owns the dependency; lower bounds still allow patched releases to float.
    "python-dotenv>=1.2.2,<2.0.0",
    "httpx>=0.25.0,<1.0.0",
    "pydantic>=2.0.0,<3.0.0",
    # Secure credential storage (system keychain)
    "keyring>=25.0.0",
    # Loaded via keyring's SecretService backend on Linux. >=50.0.0 is the
    # security floor for CVE-2026-69247 (PKCS#7 EnvelopedData oracle).
    "cryptography>=50.0.0",
    # Interactive CLI prompts
    "questionary>=2.1.0,<3.0.0",
    # The CLI customizes prompt-toolkit directly rather than only through
    # questionary, so keep it as an explicit dependency.
    "prompt-toolkit>=3.0.0,<4.0.0",
    # Requirement parsing for the submit preflight. Transitive via setuptools and
    # other optional features, but declared because the CLI imports it directly.
    "packaging>=24.0",
    # CLI framework. <0.28 keeps cli/_click_compat.py's private imports stable.
    "typer>=0.27,<0.28",
    # Do not directly constrain typer-slim: versions <0.22 shared typer/* with
    # typer, and upgrading that legacy distribution can delete Typer's files.
    "rich>=14.2.0",
]

[project.optional-dependencies]
# Server dependencies for rollout serving
server = [
    "fastapi>=0.100.0,<1.0.0",
    "uvicorn>=0.23.0,<1.0.0",
    # Uvicorn installs external Click. >=8.3.3 removes shell=True from
    # click.edit()/pager (CVE-2026-7246). The SDK CLI uses Typer's vendored
    # Click and must continue to import it only through typer._click.
    "click>=8.3.3",
]

# Strands Agents adapter. Exclude LiteLLM 1.95.0 across every owning extra: it
# published no macOS wheel, so macOS falls back to a source build that pulls
# Rust AWS crates requiring rustc 1.94.1. The exclusion is that one release —
# 1.94.2, 1.95.1, and 1.96.0 all ship macOS wheels.
# LiteLLM's tool-call path imports orjson at runtime, although LiteLLM declares
# it only through its much larger proxy extra.
strands = [
    "strands-agents[litellm]>=1.29.0,<2.0.0",
    "litellm>=1.91.1,!=1.95.0,<2.0.0",
    "orjson>=3.11.6,<4.0",
    "aiohttp>=3.14.3",
    "mcp>=1.28.1,<2.0.0",
    "click>=8.3.3",
]

# OpenAI Agents adapter. >=0.18.1 supports OpenAI Python 2.45's
# cache_write_tokens usage field.
openai-agents = [
    "openai-agents[litellm]>=0.18.1,<0.19",
    "litellm>=1.91.1,!=1.95.0,<2.0.0",
    "orjson>=3.11.6,<4.0",
    "aiohttp>=3.14.3",
    "mcp>=1.28.1,<2.0.0",
    "click>=8.3.3",
]

# Harbor execution backend. Keep Harbor on the reviewed 0.20 release line so
# rollout behavior cannot cross a compatibility boundary without an SDK
# release. SkyPilot is supplied by the rollout runtime;
# never install Harbor's [skypilot] extra because its skypilot-nightly package
# claims the same `sky` namespace as that runtime.
harbor = [
    "harbor[daytona]>=0.20.0,<0.23",
    # Harbor's SkyPilot environment parses Dockerfile WORKDIR itself, but the
    # parser is otherwise declared only by Harbor's conflicting [skypilot]
    # extra. Supply that narrow dependency without installing SkyPilot.
    "dockerfile-parse>=2.0.1,<3.0.0",
    # osmosis_ai.packaging builds the bundle wheel that Harbor installs in the
    # task container: toml rewrites the rollout project's pyproject.toml and
    # platformdirs locates the bundle cache, and uv performs the isolated wheel
    # build. Nothing outside this backend imports them, so they stay out of the
    # base install.
    "toml>=0.10.2,<1.0.0",
    "platformdirs>=4.0",
    "uv>=0.9.7,<0.13",
    # Harbor currently uses LiteLLM and PyIceberg, which own these runtime and
    # security floors in this feature.
    "litellm>=1.91.1,!=1.95.0,<2.0.0",
    "orjson>=3.11.6,<4.0",
    "aiohttp>=3.14.3",
    "click>=8.3.3",
]

# LLM-as-judge rubric evaluation
rubric = [
    "litellm>=1.91.1,!=1.95.0,<2.0.0",
    "orjson>=3.11.6,<4.0",
    "aiohttp>=3.14.3",
    "click>=8.3.3",
]

# Parquet dataset validation. >=23.0.1 is the CVE security floor.
parquet = [
    "pyarrow>=23.0.1",
]

# Local eval primitives: dataset readers, localhost callback listener, and
# the in-process LiteLLM bridge served on the FastAPI stack [server] provides.
# The rollout entrypoint itself runs in the rollout's own environment, which uv
# resolves from rollouts/<name>/pyproject.toml and launches.
eval = [
    "osmosis-ai[server,parquet]",
    "litellm>=1.91.1,!=1.95.0,<2.0.0",
    "uv>=0.9.7,<0.13",
]

# Full installation with all optional features
full = [
    "osmosis-ai[server,strands,openai-agents,harbor,rubric,parquet,eval]",
]

[dependency-groups]
# Local development environment. Runtime features remain project extras, so
# sync this group together with --all-extras for full test/type-check coverage.
dev = [
    "pytest>=9.0.3,<10.0.0",
    "pytest-asyncio>=1.4.0,<2.0.0",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0,<3.0.0",
    "ruff==0.16.0",  # Keep in sync with pre-commit and CI
    "pre-commit>=4.6.0,<5.0.0",
    "pyright[nodejs]==1.1.411",
]

[project.urls]
Homepage = "https://github.com/Osmosis-AI/osmosis-sdk-python"
Issues = "https://github.com/Osmosis-AI/osmosis-sdk-python/issues"
Changelog = "https://github.com/Osmosis-AI/osmosis-sdk-python/blob/main/CHANGELOG.md"

[project.scripts]
osmosis = "osmosis_ai.cli.main:main"
osmosis_ai = "osmosis_ai.cli.main:main"
osmosis-ai = "osmosis_ai.cli.main:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["osmosis_ai*"]

[tool.setuptools.package-data]
osmosis_ai = [
    "py.typed",
    "templates/_scaffolds/rollout/*.tpl",
]

[tool.setuptools.dynamic]
version = {attr = "osmosis_ai.consts.PACKAGE_VERSION"}

[tool.coverage.run]
source = ["osmosis_ai"]
omit = [
    "tests/*",
    "*/consts.py",
    # CLI command groups (thin Typer shells) + interactive prompts
    "osmosis_ai/cli/commands/*",
    "osmosis_ai/cli/main.py",
    "osmosis_ai/cli/upgrade.py",
    "osmosis_ai/cli/prompts.py",
    # Platform CLI business logic (API calls, OAuth, interactive prompts)
    "osmosis_ai/platform/cli/*",
    # Rollout — ABCs, type defs, integrations, harbor backend
    "osmosis_ai/rollout/agent_workflow.py",
    "osmosis_ai/rollout/grader.py",
    "osmosis_ai/rollout/backend/base.py",
    "osmosis_ai/rollout/types/*",
    "osmosis_ai/rollout/integrations/*",
    "osmosis_ai/rollout/backend/harbor/*",
]

[tool.coverage.report]
omit = [
    "tests/*",
    "*/consts.py",
    # CLI command groups (thin Typer shells) + interactive prompts
    "osmosis_ai/cli/commands/*",
    "osmosis_ai/cli/main.py",
    "osmosis_ai/cli/upgrade.py",
    "osmosis_ai/cli/prompts.py",
    # Platform CLI business logic (API calls, OAuth, interactive prompts)
    "osmosis_ai/platform/cli/*",
    # Rollout — ABCs, type defs, integrations, harbor backend
    "osmosis_ai/rollout/agent_workflow.py",
    "osmosis_ai/rollout/grader.py",
    "osmosis_ai/rollout/backend/base.py",
    "osmosis_ai/rollout/types/*",
    "osmosis_ai/rollout/integrations/*",
    "osmosis_ai/rollout/backend/harbor/*",
]
fail_under = 70
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",    # line-too-long (handled by ruff format)
    "E402",    # module-import-not-at-top-of-file (intentional lazy/conditional imports)
    "SIM117",  # multiple-with-statements (nested with is often clearer in tests)
    "RUF012",  # mutable-class-default (common with Pydantic models)
]

# En dash is used intentionally as the placeholder for empty/unset values.
allowed-confusables = ["–"]

[tool.ruff.lint.per-file-ignores]
# B008: function-call-in-default-argument — required by Typer for typer.Option/Argument
"**/cli/*.py" = ["B008"]
"**/cli/**/*.py" = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["osmosis_ai"]

[tool.pyright]
pythonVersion = "3.12"
include = ["osmosis_ai"]
exclude = [
    "tests",
    "build",
    "dist",
    "**/__pycache__",
]
typeCheckingMode = "standard"
reportMissingTypeStubs = false
reportCallInDefaultInitializer = false
